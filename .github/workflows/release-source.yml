name: Publish Production Release

on:
  push:
    branches:
      - cursor/release-simpler-price-cards-f2d7
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/**'
      - '.github/workflows/release-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${APP_VERSION}"
          BODY=$(cat <<EOF
          نسخه ${APP_VERSION} (versionCode ${APP_CODE})

          - لوگوی جدید رسمی برنامه
          - ادامه UI مینیمال و حرفه‌ای
          - دیتای واقعی و آنلاین بازار
          - منبع اصلی muchToman با fallback خودکار TGJU
          - اعتبارسنجی نرخ‌ها و رد پاسخ‌های صفر/ناقص
          - طلا، سکه، ارز و رمزارز

          APK/AAB امضاشده فقط با keystore امن تولید می‌شوند و کلید خصوصی داخل ریپوی عمومی ذخیره نمی‌شود.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "قیمت بازار ${APP_VERSION}" --notes "$BODY"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "قیمت بازار ${APP_VERSION}" --notes "$BODY"
          fi

name: Publish Production Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Guard against empty production releases
        shell: bash
        run: |
          echo "Production releases must be created only after a signed APK/AAB is ready."
          echo "Version: ${APP_VERSION} (${APP_CODE})"

      - name: Publish source-only release manually
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${APP_VERSION}"
          BODY=$(cat <<EOF
          نسخه ${APP_VERSION} (versionCode ${APP_CODE})

          - آپدیت داخل برنامه مقاوم‌تر و انتخاب آخرین APK واقعی
          - نمایش درصد دانلود، حجم فایل و توضیحات نسخه
          - جلوگیری از انتخاب Release خالی یا فایل آزمایشی
          - ادامه دیتای واقعی و آنلاین بازار با fallback خودکار

          توجه: این workflow فقط به‌صورت دستی اجرا می‌شود تا Release خالی به‌عنوان آخرین نسخه ساخته نشود.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "قیمت بازار ${APP_VERSION}" \
            --notes "$BODY"

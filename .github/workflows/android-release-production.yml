name: Android Signed Production Release

on:
  push:
    branches:
      - cursor/release-simpler-price-cards-f2d7
    paths:
      - '.github/workflows/android-release-production.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Signing keystore secret is not configured."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gheymatbazar-upload-key.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/gheymatbazar-upload-key.jks" >> "$GITHUB_ENV"
          echo "SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        if: env.SIGNING_READY == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - name: Read version
        if: env.SIGNING_READY == 'true'
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Verify and rename release files
        if: env.SIGNING_READY == 'true'
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          BT=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "gheymatbazar-${APP_VERSION}-PRODUCTION.apk"
          cp "$AAB" "gheymatbazar-${APP_VERSION}-PRODUCTION.aab"
          sha256sum "gheymatbazar-${APP_VERSION}-PRODUCTION.apk" > SHA256SUMS.txt
          sha256sum "gheymatbazar-${APP_VERSION}-PRODUCTION.aab" >> SHA256SUMS.txt

      - name: Publish GitHub Release
        if: env.SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${APP_VERSION}"
          APK="gheymatbazar-${APP_VERSION}-PRODUCTION.apk"
          AAB="gheymatbazar-${APP_VERSION}-PRODUCTION.aab"
          NOTES=$(cat <<EOF
          قیمت بازار ${APP_VERSION} (versionCode ${APP_CODE})

          - بازطراحی کامل Minimal Finance / Dark Premium
          - کارت‌های اصلی دلار، طلای ۱۸ عیار و سکه امامی
          - Favorites افقی و جستجوی جمع‌شونده
          - Detail Screen جدید با High/Low و Range روز
          - Splash مینیمال فقط لوگو
          - آپدیت داخل برنامه با شناسایی APK Production
          - دیتای واقعی بازار و fallback فعلی
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "قیمت بازار ${APP_VERSION}" \
              --notes "$NOTES"
          fi

      - name: Upload signed artifacts
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gheymatbazar-${{ env.APP_VERSION }}-production
          path: |
            gheymatbazar-${{ env.APP_VERSION }}-PRODUCTION.apk
            gheymatbazar-${{ env.APP_VERSION }}-PRODUCTION.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

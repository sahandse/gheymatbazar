name: Inspect Production Signature

on:
  push:
    branches:
      - cursor/release-simpler-price-cards-f2d7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download production 1.3.1 APK
        run: |
          curl -L --fail --retry 3 \
            https://github.com/sahandse/gheymatbazar/releases/download/v1.3.1/gheymatbazar-1.3.1-PRODUCTION.apk \
            -o previous.apk

      - name: Print APK signer certificate
        run: |
          BT=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs previous.apk

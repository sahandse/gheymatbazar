name: Build Installable APK

on:
  push:
    branches:
      - cursor/release-simpler-price-cards-f2d7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build installable debug APK
        run: gradle assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" gheymatbazar-1.3.3-installable.apk

      - name: Package Android signing tools
        shell: bash
        run: |
          BT=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p signing-tools/lib
          cp "$BT/apksigner" signing-tools/apksigner
          cp "$BT/zipalign" signing-tools/zipalign
          cp "$BT/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner signing-tools/zipalign
          echo "$BT" > signing-tools/build-tools-path.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gheymatbazar-1.3.3-installable
          path: gheymatbazar-1.3.3-installable.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools
          if-no-files-found: error
          retention-days: 7
